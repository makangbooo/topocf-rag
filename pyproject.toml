[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topocf-rag"
version = "0.1.0"
description = "Topology-counterfactual evidence path verification for multi-hop GraphRAG"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate",
  "FlagEmbedding>=1.3.5,<2",
  "httpx",
  "ijson",
  "sentencepiece",
  "transformers>=4.51,<5",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

